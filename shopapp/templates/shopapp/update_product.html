{% extends 'shopapp/base.html' %}

{% block title %}
    Update product
{% endblock %}


{% block body %}
<h1>Update current product</h1>
<div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update product
        </button>
    </form>
</div>

<div>
    <a href="{% url 'shopapp:product_details' pk=product.pk %}">
        Return to product</a>
</div>


{% endblock %}
